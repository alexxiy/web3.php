name: PHP

on: ["push", "pull_request", "workflow_dispatch"]

jobs:
  build_and_test:
    name: Build and test web3.php with ${{ matrix.php-version }}
    strategy:
      matrix:
        # composer.json requires php ^8.1 (phpseclib 4, react/async 4.3)
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    runs-on: ubuntu-latest

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
          php-version: ${{ matrix.php-version }}

    - name: PHP version
      run: |
        php --version

    - name: Install nodejs and ganache-cli
      run: |
        sudo apt-get update -y
        sudo apt-get install -y nodejs
        sudo npm install -g ganache

    - uses: actions/checkout@v4

    - name: Validate composer.json
      run: composer validate

    # composer.lock is gitignored (this is a library), so the cache is keyed on composer.json
    # and dependencies are resolved per PHP version: that is what picks the newest PHPUnit
    # each runtime supports (13 needs PHP 8.4.1+, older runtimes get 10.5 / 11.5 / 12).
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      if: steps.composer-cache.outputs.cache-hit != 'true'
      run: composer update --prefer-dist --no-progress

    - name: Run test suite
      run: sudo scripts/test.sh
